name: onemoreday

services:
  onemoreday-backend:
    container_name: onemoreday-backend
    image: onemoreday-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backend

  onemoreday-frontend:
    container_name: onemoreday-frontend
    image: onemoreday-frontend
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: frontend

networks:
  default:
    name: onemoreday
