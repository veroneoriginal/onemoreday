server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name onemoreday.fun www.onemoreday.fun;

    ssl_certificate /etc/letsencrypt/live/onemoreday.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onemoreday.fun/privkey.pem;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}
